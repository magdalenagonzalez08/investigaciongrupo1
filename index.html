<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Registro</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    
    <body>
        <form action="/procesar-formulario" method="post">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" required>

          <label for="apellido">Apellido:</label>
          <input type="text" id="apellido" name="apellido" required>

          <label for="correo">Correo Electrónico:</label>
          <input type="email" id="correo" name="correo" required>

          <label for="telefono">Teléfono:</label>
          <input type="tel" id="telefono" name="telefono" required>

          <label for="edad">Edad:</label>
          <input type="number" id="edad" name="edad" min="0" max="120" required>

          <label for="nacimiento">Fecha de Nacimiento:</label>
          <input type="date" id="nacimiento" name="nacimiento">

          <label for="provincia">Provincia:</label>
          <select id="provincia" name="provincia" required>
            <option value="">Selecciona tu provincia</option>
            <option value="bocas-del-toro">Bocas del Toro</option>
            <option value="chiriqui">Chiriquí</option>
            <option value="cocle">Coclé</option>
            <option value="colon">Colón</option>
            <option value="dariyen">Darién</option>
            <option value="herrera">Herrera</option>
            <option value="los-santos">Los Santos</option>
            <option value="panama">Panamá</option>
            <option value="veraguas">Veraguas</option>
            <option value="panama-oeste">Panamá Oeste</option>
          </select>

          <label for="intereses">Intereses:</label>
          <textarea id="intereses" name="intereses" rows="3" required></textarea>

          <label for="contrasena">Contraseña:</label>
          <input type="password" id="contrasena" name="contrasena" required>

          <input type="checkbox" id="terminos" name="terminos" value="aceptado" required>
          <label for="terminos">Acepto los términos y condiciones</label>

          <button type="submit">Enviar</button>
        </form>

    </body>
</html>
